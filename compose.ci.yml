# Isolated baseline used by the security workflow.
services:
  api:
    build: ./api
    ports:
      - "127.0.0.1:8080:3000"
    environment:
      PORT: "3000"
      MONGO_URL: mongodb://mongo:27017/taskmaster
      WORKER_URL: http://worker:5000
      JWT_SECRET: ${JWT_SECRET:?Set an ephemeral JWT_SECRET for the CI lab}
    depends_on:
      - mongo
      - worker
  worker:
    build: ./worker
    ports:
      - "127.0.0.1:5000:5000"
  mongo:
    image: mongo:3.6
